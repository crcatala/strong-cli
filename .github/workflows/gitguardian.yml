name: GitGuardian Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubicloud-standard-2
    # Skip when the API key is not configured (e.g. fresh forks without the secret).
    if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: Scan for secrets
        uses: GitGuardian/ggshield-action@192d3a2d1628db5ab758263217792029d5f9a42b  # v1.53.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
