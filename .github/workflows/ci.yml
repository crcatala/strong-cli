name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # keytar is an optionalDependency that compiles a native binding
      # against libsecret on Linux — install its headers so `npm ci` works.
      - name: Install libsecret headers (keytar native build)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      # Runs all unit tests + enforces coverage thresholds (see
      # vitest.config.ts). Live tests auto-skip — they require
      # RUN_LIVE_TESTS=1 + real credentials.
      - name: Unit tests + coverage
        run: npx vitest run --coverage
