name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # keytar is an optionalDependency that compiles a native binding
      # against libsecret on Linux — install its headers so `npm ci` works.
      - name: Install libsecret headers (keytar native build)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Typecheck + emit the dist build.
      - name: Build
        run: npm run build

      # Typechecks test files too (tsconfig.test.json includes tests/). The
      # main build excludes tests, so without this step a broken import or
      # fixture in a test only fails at runtime.
      - name: Typecheck tests
        run: npm run test:typecheck

      # Runs all unit tests + enforces coverage thresholds (see
      # vitest.config.ts). Live tests auto-skip — they require
      # RUN_LIVE_TESTS=1 + real credentials.
      - name: Unit tests + coverage
        run: npm run test:coverage

      # Smoke-tests the exact npm pack tarball as a consumer installs it.
      - name: Package smoke test
        run: npm run test:package
